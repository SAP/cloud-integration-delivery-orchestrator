_schema-version: "3.1.0"
ID: cloud-integration-delivery-orchestrator
version: 1.0.0

parameters:
  app-host-prefix: ""
  docker-image: ghcr.io/sap/cloud-integration-delivery-orchestrator:latest
  db-service-plan: development

modules:
  - name: cloud-integration-delivery-orchestrator
    type: application
    build-parameters:
      no-source: true
    parameters:
      docker:
        image: ${docker-image}
      memory: 1024M
      disk-quota: 1024M
      hosts:
        - ${app-host-prefix}
    requires:
      - name: cloud-integration-delivery-orchestrator-uaa
      - name: cloud-integration-delivery-orchestrator-uaa-api
      - name: cloud-integration-delivery-orchestrator-db
      - name: cloud-integration-delivery-orchestrator-dest
      - name: cloud-integration-delivery-orchestrator-conn
      - name: cloud-integration-delivery-orchestrator-cls

resources:
  - name: cloud-integration-delivery-orchestrator-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json

  - name: cloud-integration-delivery-orchestrator-uaa-api
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: apiaccess

  - name: cloud-integration-delivery-orchestrator-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: ${db-service-plan}

  - name: cloud-integration-delivery-orchestrator-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: cloud-integration-delivery-orchestrator-conn
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: cloud-integration-delivery-orchestrator-cls
    type: org.cloudfoundry.managed-service
    active: false
    parameters:
      service: cloud-logging
      service-plan: standard
      config:
        ingest_otlp:
          enabled: true
        retention_period: 90
